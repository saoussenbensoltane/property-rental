name: CI - Tests et Analyse

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: self-hosted  # Windows runner

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: powershell
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx

    - name: Démarrer MongoDB via Docker
      shell: powershell
      run: |
        docker run -d --name mongo-test -p 27017:27017 mongo:6.0
        Start-Sleep -Seconds 5

    - name: Vérifier que MongoDB est prêt
      shell: powershell
      run: |
        $maxRetries = 10
        $retryCount = 0
        $ready = $false
        while ($retryCount -lt $maxRetries -and -not $ready) {
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:27017" -UseBasicParsing -TimeoutSec 2
            if ($response.StatusCode -eq 200) {
              $ready = $true
              Write-Host "✅ MongoDB est prêt !"
            }
          } catch {
            Write-Host "⏳ En attente de MongoDB... ($retryCount/$maxRetries)"
          }
          $retryCount++
          Start-Sleep -Seconds 2
        }
        if (-not $ready) {
          Write-Host "❌ MongoDB n'est pas prêt après $maxRetries tentatives"
          exit 1
        }

    - name: Start backend server
      shell: powershell
      run: |
        # Démarrer le backend
        Start-Process -NoNewWindow -FilePath "uvicorn" -ArgumentList "main:app --host 0.0.0.0 --port 8000"
        Start-Sleep -Seconds 5

    - name: Wait for backend to be ready
      shell: powershell
      run: |
        $maxRetries = 15
        $retryCount = 0
        $ready = $false
        while ($retryCount -lt $maxRetries -and -not $ready) {
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:8000/health" -UseBasicParsing -TimeoutSec 2
            if ($response.StatusCode -eq 200) {
              $ready = $true
              Write-Host "✅ Backend est prêt !"
            }
          } catch {
            Write-Host "⏳ En attente du backend... ($retryCount/$maxRetries)"
          }
          $retryCount++
          Start-Sleep -Seconds 2
        }
        if (-not $ready) {
          Write-Host "❌ Backend n'est pas prêt après $maxRetries tentatives"
          exit 1
        }

    - name: Run tests with coverage
      shell: powershell
      run: |
        pytest tests/ --cov=. --cov-report=xml --cov-report=html

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

    - name: Arrêter MongoDB de test
      if: always()
      shell: powershell
      run: |
        docker stop mongo-test
        docker rm mongo-test

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Générer un tag unique
      id: tag
      shell: powershell
      run: |
        $tag = Get-Date -Format "yyyyMMddHHmmss"
        echo "tag=$tag" >> $env:GITHUB_OUTPUT

    - name: Build des images Docker
      shell: powershell
      run: |
        docker compose build frontend backend --no-cache

    - name: Tag des images
      shell: powershell
      run: |
        docker tag firstprojectbackend-frontend:latest "firstprojectbackend-frontend:${{ steps.tag.outputs.tag }}"
        docker tag firstprojectbackend-backend:latest "firstprojectbackend-backend:${{ steps.tag.outputs.tag }}"

    - name: Déployer sur Kubernetes
      shell: powershell
      run: |
        kubectl set image deployment/frontend frontend="firstprojectbackend-frontend:${{ steps.tag.outputs.tag }}"
        kubectl set image deployment/backend backend="firstprojectbackend-backend:${{ steps.tag.outputs.tag }}"

    - name: Vérifier le rollout frontend
      shell: powershell
      run: kubectl rollout status deployment/frontend

    - name: Vérifier le rollout backend
      shell: powershell
      run: kubectl rollout status deployment/backend