name: CI - Tests et Analyse

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: self-hosted

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Nécessaire pour SonarQube

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx

    - name: Start backend server
      shell: bash
      run: |
        uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 5

    - name: Wait for backend to be ready
      shell: bash
      run: |
        for i in {1..15}; do
          curl -sf http://localhost:8000/health && echo "Backend prêt !" && break
          echo "En attente du backend... ($i/15)"
          sleep 2
        done

    - name: Run tests with coverage
      shell: bash
      run: |
        pytest tests/ --cov=. --cov-report=xml --cov-report=html

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

    - name: Démarrer le port-forward SonarQube
      shell: powershell
      run: |
        Start-Process -NoNewWindow -FilePath "kubectl" -ArgumentList "port-forward svc/sonarqube 9000:9000 -n sonarqube"
        Start-Sleep -Seconds 5

    - name: Attendre que SonarQube soit prêt
      shell: bash
      run: |
        for i in {1..30}; do
          curl -sf http://localhost:9000/api/system/status && echo "SonarQube prêt !" && break
          echo "En attente de SonarQube... ($i/30)"
          sleep 3
        done

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v4
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: http://localhost:9000
      with:
        args: >
          -Dsonar.projectKey=property-rental
          -Dsonar.sources=.
          -Dsonar.python.coverage.reportPaths=coverage.xml
          -Dsonar.exclusions=**/tests/**,**/venv/**,**/node_modules/**,**/frontend/**
          -Dsonar.python.version=3.11

    - name: Arrêter le port-forward SonarQube
      if: always()
      shell: powershell
      run: |
        Get-Process kubectl -ErrorAction SilentlyContinue | Stop-Process -Force

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Générer un tag unique
      id: tag
      shell: powershell
      run: |
        $tag = Get-Date -Format "yyyyMMddHHmmss"
        echo "tag=$tag" >> $env:GITHUB_OUTPUT

    - name: Build des images Docker
      shell: powershell
      run: |
        docker compose build frontend backend --no-cache

    - name: Tag des images
      shell: powershell
      run: |
        docker tag firstprojectbackend-frontend:latest "firstprojectbackend-frontend:${{ steps.tag.outputs.tag }}"
        docker tag firstprojectbackend-backend:latest "firstprojectbackend-backend:${{ steps.tag.outputs.tag }}"

    - name: Déployer sur Kubernetes
      shell: powershell
      run: |
        kubectl set image deployment/frontend frontend="firstprojectbackend-frontend:${{ steps.tag.outputs.tag }}"
        kubectl set image deployment/backend backend="firstprojectbackend-backend:${{ steps.tag.outputs.tag }}"

    - name: Vérifier le rollout frontend
      shell: powershell
      run: kubectl rollout status deployment/frontend

    - name: Vérifier le rollout backend
      shell: powershell
      run: kubectl rollout status deployment/backend